<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14532d">
  <meta name="description" content="3チームの巴戦で、最初に対戦する2チームと待機チームを決めるあみだくじ">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <title>巴戦 あみだくじ</title>
  <style>
    :root { color-scheme: light; --green:#166534; --green2:#15803d; --paper:#fff; --ink:#17211b; --muted:#647067; --line:#dce5dd; --gold:#f59e0b; }
    * { box-sizing:border-box; }
    body { margin:0; background:#f2f7f2; color:var(--ink); font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif; }
    header { background:linear-gradient(135deg,#14532d,#15803d); color:white; padding:22px 18px 24px; text-align:center; }
    header h1 { margin:0 0 6px; font-size:1.45rem; }
    header p { margin:0; font-size:.9rem; opacity:.92; }
    main { width:min(720px,100%); margin:0 auto; padding:16px 14px 34px; }
    .card { background:white; border:1px solid var(--line); border-radius:18px; padding:16px; margin-bottom:14px; box-shadow:0 4px 16px #15351c0b; }
    h2 { font-size:1.05rem; margin:0 0 12px; }
    .teams { display:grid; gap:10px; }
    label { display:block; font-size:.86rem; font-weight:650; margin-bottom:5px; }
    input { width:100%; border:1px solid #cbd5ce; border-radius:10px; padding:12px 11px; font:inherit; font-size:1rem; background:#fff; color:var(--ink); }
    input:focus { outline:3px solid #bbf7d0; border-color:var(--green2); }
    .actions { display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-top:14px; }
    button { appearance:none; border:0; border-radius:12px; padding:13px 12px; font:inherit; font-weight:750; cursor:pointer; min-height:46px; }
    button:focus-visible { outline:3px solid #fbbf24; outline-offset:2px; }
    .primary { background:var(--green); color:white; }
    .secondary { background:#e7f2e9; color:#14532d; }
    button:disabled { opacity:.55; cursor:not-allowed; }
    .hint { color:var(--muted); font-size:.82rem; line-height:1.6; margin:10px 0 0; }
    .stage-title { display:flex; align-items:center; justify-content:space-between; gap:8px; }
    .pill { font-size:.75rem; background:#e7f2e9; color:#14532d; padding:5px 9px; border-radius:99px; white-space:nowrap; }
    #ladderWrap { width:100%; overflow:hidden; }
    #ladder { display:block; width:100%; height:auto; min-height:250px; }
    .result { display:none; }
    .result.show { display:block; }
    .match { background:#ecfdf3; border:1px solid #bbf7d0; border-radius:14px; padding:15px; text-align:center; }
    .match .label { color:#166534; font-size:.85rem; font-weight:750; }
    .pair { display:flex; align-items:center; justify-content:center; gap:10px; flex-wrap:wrap; margin:8px 0; font-size:1.15rem; font-weight:850; }
    .versus { color:#647067; font-size:.8rem; }
    .wait { margin-top:10px; background:#f8faf8; border:1px solid var(--line); border-radius:12px; padding:12px; text-align:center; }
    .wait strong { display:block; font-size:1.05rem; margin-top:3px; }
    .status { font-size:.84rem; color:var(--muted); min-height:1.4em; margin-top:8px; text-align:center; }
    footer { color:var(--muted); text-align:center; font-size:.76rem; padding:0 14px 22px; }
    @media (min-width:560px) { .teams { grid-template-columns:repeat(3,1fr); } }
    @media (prefers-reduced-motion: reduce) { * { scroll-behavior:auto !important; } }
  </style>
</head>
<body>
<header>
  <h1>巴戦 あみだくじ</h1>
  <p>最初に対戦する2チームと、待機チームを抽選</p>
</header>
<main>
  <section class="card">
    <h2>① チーム名を入力</h2>
    <div class="teams">
      <div><label for="team0">チーム 1</label><input id="team0" maxlength="20" value="チームA" autocomplete="off"></div>
      <div><label for="team1">チーム 2</label><input id="team1" maxlength="20" value="チームB" autocomplete="off"></div>
      <div><label for="team2">チーム 3</label><input id="team2" maxlength="20" value="チームC" autocomplete="off"></div>
    </div>
    <div class="actions">
      <button class="primary" id="drawBtn">あみだくじを引く</button>
      <button class="secondary" id="resetBtn">名前を初期状態に戻す</button>
    </div>
    <p class="hint">抽選はボタンを押した時点で行われます。結果が出るまで、線をたどるアニメーションが流れます。</p>
  </section>

  <section class="card">
    <div class="stage-title">
      <h2>② あみだくじ</h2>
      <span class="pill" id="drawStatus">まだ抽選していません</span>
    </div>
    <div id="ladderWrap">
      <svg id="ladder" viewBox="0 0 360 430" role="img" aria-label="3チームのあみだくじ"></svg>
    </div>
    <div class="status" id="animationStatus" aria-live="polite">「あみだくじを引く」を押してください。</div>
  </section>

  <section class="card result" id="resultCard" aria-live="polite">
    <h2>③ 抽選結果</h2>
    <div class="match">
      <div class="label">第1試合</div>
      <div class="pair"><span id="matchA"></span><span class="versus">VS</span><span id="matchB"></span></div>
    </div>
    <div class="wait">待機チーム<strong id="waitingTeam"></strong></div>
    <div class="actions">
      <button class="primary" id="againBtn">もう一度抽選する</button>
      <button class="secondary" id="shareBtn">結果をコピー</button>
    </div>
    <p class="hint" id="copyStatus"></p>
  </section>
  <p class="hint">※ あみだくじは毎回ランダムに作成します。結果を記録したい場合は「結果をコピー」を使ってください。</p>
</main>
<footer>オフライン対応・無料の個人用ツール</footer>
<script src="./app.js" defer></script>
</body>
</html>
